<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>안녕하세요</title>
  <style>
    :root {
      --bg: #faf8f5;
      --fg: #2b2b2b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --fg: #f2f2f2;
      }
    }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }
    h1 {
      font-size: clamp(1.75rem, 6vw, 3.5rem);
      font-weight: 600;
      text-align: center;
      word-break: keep-all;
    }
  </style>
</head>
<body>
  <h1>안녕하세요. 갈렙입니다</h1>
</body>
</html>
